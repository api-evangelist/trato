aid: trato
name: Trato
description: >-
  TRATO is an AI-powered Contract Lifecycle Management (CLM) and electronic
  signature platform used by more than 180,000 users to centralize, draft,
  approve, sign and track contracts. It offers template-based smart drafting,
  automated approval routing, real-time contract tracking, and secure
  e-signatures, with multi-jurisdiction legal expertise across Mexico, Spain and
  Germany and support for Mexican NOM-151 advanced electronic signatures. TRATO
  exposes a JWT-authenticated REST API (Contracts, Templates, Milestones) and
  webhook events for programmatic contract generation and integration with CRM,
  document management and payment systems. Founded in 2014 in Mexico City and
  backed by 500 Global.

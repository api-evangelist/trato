overlay: 1.0.0
info:
  title: API Evangelist enhancements for TRATO Contract API
  version: 1.0.0
extends: openapi/trato-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-source: https://developer.trato.io/
      x-apievangelist-notes: >-
        Spec generated by API Evangelist from TRATO's public developer
        documentation; TRATO publishes no machine-readable OpenAPI.
      x-api-category: contract-lifecycle-management
  - target: $.info
    update:
      x-webhooks: asyncapi/trato-webhooks-asyncapi.yml
  - target: $.components.securitySchemes.bearerAuth
    update:
      x-token-source: https://clm-test.trato.io/profile?menu=profile-security
